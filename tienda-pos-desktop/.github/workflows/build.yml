name: Publicar version

on:
  push:
    tags:
      - "v*"

jobs:
  publicar:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar Tauri CLI
        run: npm install -g @tauri-apps/cli@1

      - name: Compilar y publicar
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Version ${{ github.ref_name }}"
          releaseBody: "Actualizacion publicada automaticamente desde GitHub Actions."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false

      - name: Generar y publicar latest.json (actualizador propio)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $installer = Get-ChildItem -Recurse -Path "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "No se encontro el instalador .exe generado por tauri-action" }
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$([uri]::EscapeDataString($installer.Name))"
          $manifest = [ordered]@{
            version   = $version
            notes     = "Actualizacion $version publicada automaticamente desde GitHub Actions."
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = ""
                url       = $url
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path "latest.json" -Encoding utf8
          gh release upload $tag latest.json --repo "${{ github.repository }}" --clobber
