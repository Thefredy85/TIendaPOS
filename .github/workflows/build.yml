name: Publicar version

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version a publicar, por ejemplo v0.2.11"
        required: true

jobs:
  publicar:
    permissions:
      contents: write
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Revisar que el numero de version coincida
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $expected = $env:TAG.TrimStart('v')
          if ($conf.package.version -ne $expected) {
            throw "La version en tauri.conf.json ($($conf.package.version)) no coincide con $env:TAG. Sube tauri.conf.json con la version correcta."
          }

      - name: Pruebas de la logica (ventas, inventario, productos, ajustes)
        working-directory: src-tauri
        run: cargo test

      - name: Pruebas de pantalla (tocar, escanear y cobrar)
        shell: pwsh
        env:
          PW_CHANNEL: chrome
        run: |
          npm install --no-save playwright
          $f = Get-ChildItem -Recurse -File -Filter "ui-smoke.mjs" | Where-Object { $_.FullName -notmatch "node_modules" } | Select-Object -First 1
          if (-not $f) { throw "Falta el archivo ui-smoke.mjs en el repositorio. Subelo (en la carpeta tests o en la raiz) y vuelve a publicar." }
          Write-Host "Usando $($f.FullName)"
          node $f.FullName

      - name: Instalar Tauri CLI
        run: npm install -g @tauri-apps/cli@1

      - name: Compilar y publicar
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: "Version ${{ env.TAG }}"
          releaseBody: "Actualizacion publicada automaticamente desde GitHub Actions."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false

      - name: Generar y publicar latest.json (actualizador propio)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:TAG
          $version = $tag.TrimStart('v')
          # Se usa el nombre REAL con el que GitHub guardo el instalador (cambia espacios por puntos)
          $assets = gh release view $tag --repo "${{ github.repository }}" --json assets | ConvertFrom-Json
          $asset = $assets.assets | Where-Object { $_.name -like "*-setup.exe" } | Select-Object -First 1
          if (-not $asset) { throw "No se encontro el instalador en la publicacion $tag" }
          $url = $asset.url
          Write-Host "Instalador: $url"
          $manifest = [ordered]@{
            version   = $version
            notes     = "Actualizacion $version publicada automaticamente desde GitHub Actions."
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = ""
                url       = $url
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path "latest.json" -Encoding utf8
          gh release upload $tag latest.json --repo "${{ github.repository }}" --clobber
