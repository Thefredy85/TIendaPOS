name: Prueba de la firma de licencias

# Prueba de punta a punta de la Edge Function "licencia" desde los servidores de GitHub.
# Se lanza a mano con el token de una caja de PRUEBA (negocio TP-PRUEBA-FIRMA, que se borra
# al terminar). No publica nada ni toca la app.
on:
  workflow_dispatch:
    inputs:
      token:
        description: "Token de la caja de prueba aprobada"
        required: true
      token_pendiente:
        description: "Token de una caja de prueba pendiente de aprobación"
        required: true

jobs:
  firma:
    runs-on: ubuntu-latest
    steps:
      - name: Ocultar los tokens en el registro
        run: |
          echo "::add-mask::${{ inputs.token }}"
          echo "::add-mask::${{ inputs.token_pendiente }}"

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Probar la función
        env:
          TOKEN: ${{ inputs.token }}
          TOKEN_PENDIENTE: ${{ inputs.token_pendiente }}
          # Llave PÚBLICA (la misma que lleva la app); comprueba firmas, no puede crearlas.
          PUBLIC_KEY: owfgrcVavzb9Va6yLlX4Hh5YRFJQeuYFsFzkcBbcmT8=
          URL: https://qizccncdyhzxeltwzjni.supabase.co/functions/v1/licencia
        run: |
          cat > prueba.mjs <<'EOF'
          import crypto from 'node:crypto';
          const { TOKEN, TOKEN_PENDIENTE, PUBLIC_KEY, URL } = process.env;
          const key = crypto.createPublicKey({ key: Buffer.concat([Buffer.from('302a300506032b6570032100', 'hex'), Buffer.from(PUBLIC_KEY, 'base64')]), format: 'der', type: 'spki' });
          const verify = (payload, sig) => crypto.verify(null, Buffer.from(payload, 'utf8'), key, Buffer.from(sig, 'base64'));
          const call = (body) => fetch(URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
          let fails = 0;
          const ok = (name, cond, extra = '') => { console.log(`  ${cond ? 'OK   ' : 'FALLA'} ${name}${cond ? '' : ' ' + extra}`); if (!cond) fails++; };
          let r = await call({ token: TOKEN });
          const b = await r.json();
          ok('la caja aprobada recibe respuesta 200', r.status === 200, String(r.status));
          ok('la firma es válida con la llave pública de la app', !!b.payload && verify(b.payload, b.signature));
          const lic = JSON.parse(b.payload || '{}');
          ok('la licencia trae los datos definidos', lic.has_license === true && lic.license_key === 'TP-PRUEBA-FIRMA' && lic.cut_day === 5 && lic.paid_until === '2026-11-05' && lic.enforce === true, JSON.stringify({ k: lic.license_key, c: lic.cut_day, p: lic.paid_until, e: lic.enforce }));
          ok('la licencia trae el contacto y el secreto del código', !!lic.contact && typeof lic.unlock_secret === 'string' && lic.unlock_secret.length === 32);
          const tampered = (b.payload || '').replace('2026-11-05', '2030-11-05');
          ok('una licencia alterada NO pasa la firma', tampered !== b.payload && !verify(tampered, b.signature));
          r = await call({ token: 'f'.repeat(64) });
          ok('un token falso se rechaza (401)', r.status === 401, String(r.status));
          r = await call({});
          ok('sin token se rechaza (401)', r.status === 401, String(r.status));
          r = await call({ token: TOKEN_PENDIENTE });
          ok('una caja pendiente de aprobación se rechaza (401)', r.status === 401, String(r.status));
          r = await fetch(URL, { method: 'GET' });
          ok('otro método que no sea POST se rechaza (405)', r.status === 405, String(r.status));
          console.log(fails ? `${fails} FALLA(S)` : 'Todas las pruebas de la firma pasaron.');
          process.exit(fails ? 1 : 0);
          EOF
          node prueba.mjs
